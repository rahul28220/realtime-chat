<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat - Real-Time Collaboration & Messaging</title>

  <!-- Tailwind CSS & Custom Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Lucide Icons & Socket.io CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Auth / Join Modal -->
  <div id="joinModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-2">
        <div
          class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-500/25">
          <i data-lucide="message-square" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-white tracking-tight">Join PulseChat</h2>
        <p class="text-xs text-slate-400">Enter a display name to connect to real-time rooms</p>
      </div>

      <form id="joinForm" onsubmit="handleJoin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Your Name / Handle</label>
          <input type="text" id="usernameInput" required placeholder="e.g. Alex, DevRider"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Starting Room</label>
          <select id="initialRoomSelect"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
            <option value="general"># general</option>
            <option value="engineering"># engineering</option>
            <option value="design"># design</option>
          </select>
        </div>
        <button type="submit"
          class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition">
          Enter Chat
        </button>
      </form>
    </div>
  </div>

  <!-- Main App Shell -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Left Sidebar: Channels & Users -->
    <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
      <div class="p-4 border-b border-slate-800 flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center text-white">
          <i data-lucide="zap" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="font-bold text-sm tracking-tight text-white">PulseChat</span>
          <span class="text-[10px] block text-emerald-400 font-medium">● Connected</span>
        </div>
      </div>

      <!-- Channels List -->
      <div class="flex-1 overflow-y-auto p-3 space-y-5">
        <div>
          <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Channels</h4>
          <div class="space-y-1">
            <button onclick="switchRoom('general')" id="room-general"
              class="room-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition bg-slate-800 text-white">
              <i data-lucide="hash" class="w-4 h-4 text-slate-400"></i> general
            </button>
            <button onclick="switchRoom('engineering')" id="room-engineering"
              class="room-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
              <i data-lucide="hash" class="w-4 h-4 text-slate-400"></i> engineering
            </button>
            <button onclick="switchRoom('design')" id="room-design"
              class="room-btn w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
              <i data-lucide="hash" class="w-4 h-4 text-slate-400"></i> design
            </button>
          </div>
        </div>

        <!-- Online Room Members -->
        <div>
          <div class="flex items-center justify-between px-3 mb-2">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Active In Room</h4>
            <span id="userCountBadge"
              class="text-[10px] bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full font-semibold">1</span>
          </div>
          <div id="usersList" class="space-y-1 px-1">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>

      <!-- User Profile Footbar -->
      <div class="p-3 border-t border-slate-800 bg-slate-950/40 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div
            class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-xs"
            id="avatarInitial">U</div>
          <div>
            <p id="currentUserDisplay" class="text-xs font-bold text-white truncate max-w-[120px]">Guest</p>
            <p class="text-[10px] text-emerald-400">Online</p>
          </div>
        </div>
        <button onclick="leaveChat()" title="Leave" class="text-slate-500 hover:text-rose-400 p-1.5 rounded transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <!-- Chat Area -->
    <section class="flex-1 flex flex-col bg-slate-950 overflow-hidden">

      <!-- Top Chat Header -->
      <div class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50 backdrop-blur">
        <div class="flex items-center gap-2">
          <i data-lucide="hash" class="w-5 h-5 text-indigo-400"></i>
          <div>
            <h3 id="currentRoomTitle" class="font-bold text-sm text-white">general</h3>
            <p class="text-[11px] text-slate-400">Public collaborative channel</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span
            class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700/60 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Real-Time Socket
          </span>
        </div>
      </div>

      <!-- Messages Stream -->
      <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Typing Alert Indicator -->
      <div id="typingIndicator" class="px-6 py-1 text-xs text-indigo-400 italic hidden flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
        <span id="typingText">Someone is typing...</span>
      </div>

      <!-- Message Input Box -->
      <div class="p-4 bg-slate-900/40 border-t border-slate-800">
        <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-3">
          <input type="text" id="messageInput" oninput="handleTyping()" placeholder="Type a message into #general..."
            autocomplete="off"
            class="flex-1 px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
          <button type="submit"
            class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition">
            <span>Send</span>
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </div>

    </section>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
